apiVersion: apps/v1
kind: Deployment
metadata:
  name: springboot-api
  namespace: tutorial-app
  labels:
    app: springboot-api
spec:
  replicas: 2  
  selector:
    matchLabels:
      app: springboot-api
  template:
    metadata:
      labels:
        app: springboot-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
    spec:
      # Hardened: Using dedicated ServiceAccount instead of default
      serviceAccountName: springboot-sa
      automountServiceAccountToken: false
      
      # Security Context: Enforce non-root execution across all containers
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001

      initContainers:
      - name: wait-for-mysql
        image: busybox:1.31.1
        command: ['sh', '-c', "until nc -z -w 2 mysql-database 3306; do echo 'Waiting for MySQL...'; sleep 2; done"]
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL

      containers:
      - name: springboot-api
        image: ahmedikram567/spring-boot-server:latest
        imagePullPolicy: IfNotPresent
        
        # Hardened Container Security Context
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
            
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP

        env:
        - name: SPRING_DATASOURCE_URL
          valueFrom:
            secretKeyRef:
              name: spring-database-credentials
              key: datasource-url
        - name: SPRING_DATASOURCE_USERNAME
          valueFrom:
            secretKeyRef:
              name: spring-database-credentials
              key: datasource-username
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: spring-database-credentials
              key: datasource-password
        - name: SPRING_JPA_HIBERNATE_DDL_AUTO
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: spring-jpa-hibernate-ddl-auto
        - name: SPRING_JPA_HIBERNATE_DIALECT
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: spring-jpa-hibernate-dialect
        - name: SERVER_SERVLET_CONTEXT_PATH
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: server-servlet-context-path

        # Volume Mount for Hardened Secret Reading
        volumeMounts:
        - name: db-secrets
          mountPath: "/etc/secrets"
          readOnly: true

        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"

        readinessProbe:
          httpGet:
            path: /api/tutorials
            port: 8080
          initialDelaySeconds: 40
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 5

        livenessProbe:
          httpGet:
            path: /api/tutorials
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 5

      volumes:
      - name: db-secrets
        secret:
          secretName: spring-database-credentials