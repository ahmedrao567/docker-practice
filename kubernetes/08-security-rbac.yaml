apiVersion: v1
kind: ServiceAccount
metadata:
  name: springboot-sa
  namespace: tutorial-app
automountServiceAccountToken: false  # Prevents mounting the API token inside the pod
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: springboot-read-role
  namespace: tutorial-app
rules:
  # Allows Spring Boot to only read ConfigMaps/Secrets in its own namespace if needed
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: springboot-read-binding
  namespace: tutorial-app
subjects:
  - kind: ServiceAccount
    name: springboot-sa
    namespace: tutorial-app
roleRef:
  kind: Role
  name: springboot-read-role
  apiGroup: rbac.authorization.k8s.io