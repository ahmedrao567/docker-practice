apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "springboot-api.fullname" . }}
  labels:
    {{- include "springboot-api.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "springboot-api.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "springboot-api.selectorLabels" . | nindent 8 }}
    spec:
      initContainers:
        - name: wait-for-mysql
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z {{ .Values.mysql.host }} {{ .Values.mysql.port }}; do echo waiting for mysql; sleep 2; done
      containers:
        - name: springboot-api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "springboot-api.fullname" . }}
            - secretRef:
                name: {{ include "springboot-api.fullname" . }}
          readinessProbe:
            httpGet:
              path: /api/tutorials
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/tutorials
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}