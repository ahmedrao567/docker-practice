replicaCount: 2

image:
  repository: ahmedikram567/spring-boot-server
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080

mysql:
  host: mysql-database
  port: 3306
  database: testdb
  username: root
  password: change-me
  ddlAuto: update
  dialect: org.hibernate.dialect.MySQLDialect

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi